
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos | Cecytos No Reprobados 🐆</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #fff0f6;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #754765;
            margin: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px;
        }

        h1 {
            color: #c2185b;
        }

        .selector, .opciones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 13px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: transform .2s;
        }

        button:hover {
            transform: scale(1.03);
        }

        .materia {
            background: #f8cce0;
            color: #813c61;
        }

        .materia:nth-child(2) {
            background: #c9e7ff;
            color: #285579;
        }

        .materia:nth-child(3) {
            background: #ffe2ad;
            color: #79531e;
        }

        .materia:nth-child(4) {
            background: #d9f0d2;
            color: #38613a;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            margin: 20px auto;
            border-radius: 22px;
            box-shadow: 0 4px 14px #d9a7c566;
            max-width: 650px;
        }

        .opcion {
            background: #f8cce0;
            color: #754765;
            width: 100%;
            max-width: 420px;
        }

        .opcion:disabled {
            cursor: default;
            opacity: .8;
        }

        .principal {
            background: #d95b98;
            color: white;
            margin: 8px;
        }

        #mensaje {
            font-weight: bold;
            min-height: 25px;
        }

        #progreso {
            font-weight: bold;
            color: #b13d7c;
        }

        .volver {
            display: inline-block;
            margin: 15px;
            color: #b13d7c;
            text-decoration: none;
            font-weight: bold;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
<div class="contenedor">

    <h1>Juega y aprende con Cecytos🐆</h1>

    <p>Elige una materia, responde las preguntas y gana puntos.</p>

    <div class="selector">
        <button class="materia" onclick="iniciar('matematicas')">
            📐 Matemáticas
        </button>

        <button class="materia" onclick="iniciar('programacion')">
            💻 Programación
        </button>

        <button class="materia" onclick="iniciar('lengua')">
            📖 Lengua y Comunicación
        </button>

        <button class="materia" onclick="iniciar('humanidades')">
            📚 Humanidades
        </button>
    </div>

    <section class="tarjeta" id="juego" hidden>
        <h2 id="titulo"></h2>
        <p id="progreso"></p>
        <h3 id="pregunta"></h3>

        <div class="opciones" id="opciones"></div>

        <p id="mensaje" aria-live="polite"></p>

        <h3 id="puntos"></h3>

        <button id="siguiente" class="principal"
                onclick="avanzar()" hidden>
            Siguiente pregunta
        </button>

        <button id="repetir" class="principal"
                onclick="iniciar(materiaActual)" hidden>
                Volver a jugar
        </button>
    </section>

    <a class="volver" href="{{ url_for('bienvenida') }}">
        Volver a mis materias
    </a>

</div>

<script>
const juegos = {
    matematicas: {
        titulo: "📐 Reto matemático",
        preguntas: [
            {
                texto: "¿Cuánto es 8 × 7?",
                opciones: ["54", "56", "64", "48"],
                correcta: 1
            },
            {
                texto: "¿Cuánto es 25 + 37?",
                opciones: ["52", "62", "72", "57"],
                correcta: 1
            },
            {
                texto: "¿Cuánto es 100 ÷ 4?",
                opciones: ["20", "40", "25", "10"],
                correcta: 2
            },
            {
                texto: "¿Cuál es el resultado de 9²?",
                opciones: ["18", "72", "81", "99"],
                correcta: 2
            },
            {
                texto: "¿Cuánto es 15 - 8?",
                opciones: ["6", "7", "8", "9"],
                correcta: 1
            }
        ]
    },

    programacion: {
        titulo: "💻 Desafío de programación",
        preguntas: [
            {
                texto: "¿Qué es un algoritmo?",
                opciones: [
                    "Una computadora",
                    "Una secuencia de pasos para resolver un problema",
                    "Un color de pantalla",
                    "Un archivo de imagen"
                ],
                correcta: 1
            },
            {
                texto: "¿Para qué sirve HTML?",
                opciones: [
                    "Estructurar páginas web",
                    "Reparar computadoras",
                    "Crear cables",
                    "Editar fotografías únicamente"
                ],
                correcta: 0
            },
            {
                texto: "¿Qué es un framework?",
                opciones: [
                    "Un videojuego",
                    "Una estructura de herramientas para desarrollar software",
                    "Un tipo de monitor",
                    "Un sistema de impresión"
                ],
                correcta: 1
            },
            {
                texto: "¿Qué significa la metodología Scrum?",
                opciones: [
                    "Una metodología ágil de trabajo",
                    "Un lenguaje de marcado",
                    "Una base de datos",
                    "Un sistema operativo"
                ],
                correcta: 0
            },
            {
                texto: "¿Qué lenguaje se utiliza en este proyecto para crear rutas web?",
                opciones: ["HTML", "CSS", "Python", "SQL"],
                correcta: 2
            }
        ]
    },

    lengua: {
        titulo: "📖 Reto de Lengua y Comunicación",
        preguntas: [
            {
                texto: "¿Cuál palabra está escrita correctamente?",
                opciones: ["Haver", "Haber", "Aver", "Haberh"],
                correcta: 1
            },
            {
                texto: "¿Cuál es un sinónimo de feliz?",
                opciones: ["Triste", "Enojado", "Contento", "Cansado"],
                correcta: 2
            },
            {
                texto: "¿Qué signo se utiliza para formular una pregunta?",
                opciones: [".", "¡!", "¿?", ","],
                correcta: 2
            },
            {
                texto: "¿Cuál es el sujeto de 'María estudia mucho'?",
                opciones: ["Estudia", "Mucho", "María", "Estudia mucho"],
                correcta: 2
            },
            {
                texto: "¿Qué es un texto narrativo?",
                opciones: [
                    "Un texto que cuenta acontecimientos",
                    "Una lista de números",
                    "Una fórmula matemática",
                    "Un dibujo sin historia"
                ],
                correcta: 0
            }
        ]
    },

    humanidades: {
        titulo: "📚 Desafío de Humanidades",
        preguntas: [
            {
                texto: "¿Qué estudian las humanidades?",
                opciones: [
                    "Solamente los planetas",
                    "Al ser humano, su cultura y sus ideas",
                    "Únicamente las operaciones",
                    "Solo los animales"
                ],
                correcta: 1
            },
            {
                texto: "¿Qué es la ética?",
                opciones: [
                    "El estudio de los números",
                    "La reflexión sobre lo correcto y lo incorrecto",
                    "Una lengua extranjera",
                    "Una herramienta de programación"
                ],
                correcta: 1
            },
            {
                texto: "¿Qué es la empatía?",
                opciones: [
                    "Ignorar a los demás",
                    "Comprender los sentimientos de otras personas",
                    "Ganar todas las discusiones",
                    "Memorizar fechas"
                ],
                correcta: 1
            },
            {
                texto: "¿Qué es la cultura?",
                opciones: [
                    "Las costumbres, creencias y expresiones de una sociedad",
                    "Un tipo de computadora",
                    "Una operación matemática",
                    "Una fórmula química"
                ],
                correcta: 0
            },
            {
                texto: "¿Qué favorece el diálogo?",
                opciones: [
                    "Los malentendidos",
                    "La falta de escucha",
                    "La comprensión y el intercambio de ideas",
                    "Evitar toda conversación"
                ],
                correcta: 2
            }
        ]
    }
};

let materiaActual = "";
let preguntasActuales = [];
let indice = 0;
let puntos = 0;
let respondida = false;

function iniciar(materia) {
    materiaActual = materia;
    preguntasActuales = [...juegos[materia].preguntas]
        .sort(() => Math.random() - 0.5);

    indice = 0;
    puntos = 0;

    document.getElementById("juego").hidden = false;
    document.getElementById("titulo").textContent =
        juegos[materia].titulo;

    document.getElementById("repetir").hidden = true;

    mostrarPregunta();

    document.getElementById("juego").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function mostrarPregunta() {
    respondida = false;

    const actual = preguntasActuales[indice];

    document.getElementById("progreso").textContent =
        `Pregunta ${indice + 1} de ${preguntasActuales.length}`;

    document.getElementById("pregunta").textContent = actual.texto;
    document.getElementById("mensaje").textContent = "";
    document.getElementById("puntos").textContent =
        `⭐ Puntos: ${puntos}`;

    document.getElementById("siguiente").hidden = true;
    document.getElementById("opciones").innerHTML = "";

    actual.opciones.forEach((opcion, i) => {
        const boton = document.createElement("button");

        boton.className = "opcion";
        boton.textContent = opcion;
        boton.onclick = () => responder(i, boton);

        document.getElementById("opciones").appendChild(boton);
    });
}

function responder(seleccion, boton) {
    if (respondida) return;

    respondida = true;

    const actual = preguntasActuales[indice];
    const botones = document.querySelectorAll(".opcion");

    botones.forEach(b => b.disabled = true);

    if (seleccion === actual.correcta) {
        puntos += 20;
        document.getElementById("mensaje").textContent =
            "¡Excelente! Respuesta correcta. +20 puntos";
    } else {
        document.getElementById("mensaje").textContent =
            "Sigue intentando, La respuesta correcta es: " +
            actual.opciones[actual.correcta];
    }

    document.getElementById("puntos").textContent =
        `⭐ Puntos: ${puntos}`;

    document.getElementById("siguiente").hidden = false;

    if (indice === preguntasActuales.length - 1) {
        document.getElementById("siguiente").textContent =
            "Ver resultado 🏆";
    } else {
        document.getElementById("siguiente").textContent =
            "Siguiente pregunta ➜";
    }
}

function avanzar() {
    if (!respondida) return;

    indice++;

    if (indice < preguntasActuales.length) {
        mostrarPregunta();
        return;
    }

    document.getElementById("progreso").textContent =
        "¡Terminaste el juego!";

    document.getElementById("pregunta").textContent =
        puntos >= 80
        ? "🏆 ¡Excelente trabajo!"
        : "¡Buen intento! Sigue practicando.";

    document.getElementById("opciones").innerHTML = "";

    document.getElementById("mensaje").textContent =
        `Obtuviste ${puntos} de 100 puntos.`;

    document.getElementById("puntos").textContent =
        puntos === 100
        ? "Puntuación perfecta🐆"
        : "Cada intento te ayuda a aprender";

    document.getElementById("siguiente").hidden = true;
    document.getElementById("repetir").hidden = false;
}
</script>

</body>
</html>
