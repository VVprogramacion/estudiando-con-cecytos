
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estudiando con Cecytos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Estudiando con Cecytos</h1>

    <img src="{{ url_for('static', filename='imagenes/leoparditos.png') }}"
         alt="Estudia con los cecytos"
         width="300">

    <h2>¡BIENVENIDOS!</h2>

    <!-- BOTONES PRINCIPALES -->
    <div id="opciones">

        <h2>¿Qué deseas hacer?</h2>

        <button type="button" onclick="mostrarLogin()">
            Iniciar sesión
        </button>

        <button type="button" onclick="mostrarRegistro()">
            Registrarme
        </button>

    </div>

    
    <div id="login" style="display: none;">

        <h2>Iniciar sesión</h2>
        
        <form action="/login" method="POST">

            <label>Numero de control:</label>
            <input type="text" name="Id" required>
            <br><br>

            <label>Contraseña:</label>
            <input type="password" name="contrasena" required>
            <br><br>

            <button type="submit">Entrar</button>

                    <div class="contacto-instagram">
                <a href="https://www.instagram.com/cecytos.no.reprobados/"
                target="_blank"
                rel="noopener noreferrer">
                ¿Olvidaste tu contraseña?
            </a>
            </div>

        </form>

        <br>

        <button type="button" onclick="volver()">
            Regresar
        </button>

    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <div id="registro" style="display: none;">

        <h2>Crear cuenta</h2>

        <form action="/registrar" method="POST">

            <label>Numero de control:</label>
            <input type="text" name="Id" required>
            <br><br>

            <label>Nombre:</label>
            <input type="text" name="nombre" required>
            <br><br>

            <label>Edad:</label>
            <input type="number" name="edad" required>
            <br><br>

            <label>Correo:</label>
            <input type="email" name="correo" required>
            <br><br>

            <label>Grupo:</label>
            <input type="text" name="grupo" required>
            <br><br>

            <label>Contraseña:</label>
            <input type="password" name="contrasena" required>
            <br><br>

            <button type="submit">Registrar</button>

        </form>

        <br>

        <button type="button" onclick="volver()">
            Regresar
        </button>

    </div>

    <!-- FUNCIONES PARA MOSTRAR LOS FORMULARIOS -->
    <script>

        function mostrarLogin() {
            document.getElementById("opciones").style.display = "none";
            document.getElementById("login").style.display = "block";
        }

        function mostrarRegistro() {
            document.getElementById("opciones").style.display = "none";
            document.getElementById("registro").style.display = "block";
        }

        function volver() {
            document.getElementById("opciones").style.display = "block";
            document.getElementById("login").style.display = "none";
            document.getElementById("registro").style.display = "none";
        }




    </script>

</body>
</html>
